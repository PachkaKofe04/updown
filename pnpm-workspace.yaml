packages:
  - apps/*
  - packages/*

# Пакеты, которым разрешено выполнять install-скрипты (pnpm блокирует остальные).
allowBuilds:
  esbuild: true
  unrs-resolver: true
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
